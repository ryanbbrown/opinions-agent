[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "opinions-agent"
version = "0.1.0"
description = "Readwise-to-opinions human-in-the-loop summary agent."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "alembic>=1.17",
    "braintrust>=0.26.0",
    "fastapi>=0.124",
    "httpx>=0.28",
    "openai>=2.44.0",
    "psycopg[binary]>=3.3",
    "pydantic>=2.13",
    "sqlalchemy>=2.0",
    "thinharness[tracing] @ git+https://github.com/ryanbbrown/thinharness.git@v0.5.0",
    "uvicorn>=0.38",
]

[project.scripts]
opinions-agent = "opinions_agent.cli:main"

[dependency-groups]
dev = [
    "pyright>=1.1.409",
    "pytest>=8.4",
    "pytest-asyncio>=1.3",
    "ruff>=0.14",
]

[tool.hatch.build.targets.wheel]
packages = ["src/opinions_agent"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"src/opinions_agent/app.py" = ["B008"]

[tool.pyright]
include = ["src/opinions_agent"]
exclude = ["tests", ".runs", ".reviews", ".html"]
pythonVersion = "3.11"
typeCheckingMode = "basic"
